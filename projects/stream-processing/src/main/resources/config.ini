# Defaults packaged in the job jar. No secrets here: passwords come from env
# KAIZEN_POSTGRES_PASSWORD / KAIZEN_CLICKHOUSE_PASSWORD (Secret compute/kaizen-stream-secrets, see flink-session.yaml).
# Mặc định đóng gói trong jar. Không chứa bí mật: mật khẩu lấy từ env
# KAIZEN_POSTGRES_PASSWORD / KAIZEN_CLICKHOUSE_PASSWORD (Secret compute/kaizen-stream-secrets, xem flink-session.yaml).

[postgres]
host = my-postgres-postgresql.databases.svc.cluster.local
port = 5432
database = information_system
username = postgres
# Aggregates per transaction / Số aggregate mỗi transaction
batch_size = 500
flush_interval_ms = 1000

[elasticsearch]
hosts = http://elasticsearch.logging.svc.cluster.local:9200
bulk_max_actions = 500
bulk_interval_ms = 1000

[kafka]
bootstrap_servers = kaizen-kafka.streaming.svc.cluster.local:9092
group_id = kaizen-stream-group
auto_offset_reset = earliest
topic_partitions = 3
# Kafka retention maintenance / Dọn message Kafka (KafkaRetentionJob via Airflow)
retention_days = 2
retention_ms = 172800000
# 256MB/partition × 3 partitions × 2 topics ≈ 1.5GB max log (fits 2Gi broker)
retention_bytes_per_partition = 268435456
topics = order-bundles,payment-bundles
strategy = delete_records
dry_run = false
check_consumer_lag = true

[flink]
# Source parallelism must divide every topic's partition count (6 and 3)
# Parallelism source phải chia hết số partition của mọi topic (6 và 3)
parallelism = 3
kafka_parallelism = 3
source_parallelism = 3
checkpoint_interval_ms = 10000

[clickhouse]
host = clickhouse-service.databases.svc.cluster.local
port = 8123
database = default
username = admin

[business_realtime]
# BusinessRealtimeJob → report.realtime_business_by_order
# Days served from the hot table; older days come from cold / Số ngày đọc từ bảng hot; ngày cũ hơn đọc từ cold
hot_days = 14
# Flink state TTL = CH table TTL; older rows are frozen / TTL state Flink = TTL bảng CH; dòng cũ hơn bị đóng băng
state_days = 16
batch_size = 500
batch_interval_ms = 2000
# Reload shop."Shop" names from PG / Chu kỳ nạp lại tên cửa hàng từ PG
shop_refresh_ms = 600000

[payment]
# PaymentProducerJob profile (supply_chain_forecast_optimization.md 3.6, E7)
# Hồ sơ mô phỏng thanh toán của PaymentProducerJob
# Keyed state TTL, covers returns up to 14 days / TTL state, bao trọn trả hàng tới 14 ngày
state_days = 16
# First attempt: success / failed, the rest is PENDING / Lần đầu: thành công / thất bại, còn lại là PENDING
success_rate = 0.92
failed_rate = 0.05
# The last attempt always succeeds / Lần thử cuối luôn thành công
max_attempts = 3
first_delay_min_ms = 2000
first_delay_max_ms = 10000
retry_delay_min_ms = 60000
retry_delay_max_ms = 300000
pending_min_ms = 600000
pending_max_ms = 1800000
refund_delay_min_ms = 2000
refund_delay_max_ms = 10000
# Receipts paid with two methods / Phiếu thu trả bằng 2 phương thức
split_rate = 0.15
# E-wallet share ramps linearly (E7); cash/card split the rest / Ví tăng tuyến tính (E7); tiền mặt/thẻ chia phần còn lại
wallet_share_from = 0.15
wallet_share_to = 0.45
wallet_ramp_start = 2024-01-01
wallet_ramp_end = 2026-09-30
cash_share_of_rest = 0.6

[order]
# OrderProducerJob profile until DemandPlan exists (supply_chain_forecast_optimization.md 3.1–3.6)
# Hồ sơ mô phỏng đơn của OrderProducerJob khi chưa có DemandPlan
# Same seed + same master data → same orders / Cùng seed + cùng master → cùng đơn
seed = 20261011
# Mean orders/day for the chain; weekday factors and the 24h curve are in code
# Số đơn TB/ngày toàn chuỗi; hệ số thứ và đường cong 24 giờ nằm trong code
orders_per_day = 10000
# Shops ranked by code: first A, next B, the rest C; only A sells 22–07h
# Xếp shop theo mã: A, B, còn lại C; 22–07h chỉ hạng A bán
tier_a_count = 10
tier_b_count = 20
tier_a_weight = 230
tier_b_weight = 150
tier_c_weight = 90
# Lines per order = 1 + Poisson(mean), capped / Số dòng = 1 + Poisson(mean), có trần
extra_lines_mean = 1.4
max_lines = 6
walk_in_rate = 0.20
voucher_rate = 0.10
# Orders getting a gift line while a GIFT promotion runs / Tỷ lệ đơn được tặng quà khi có CT quà tặng
gift_rate = 0.30
return_rate = 0.04
return_full_rate = 0.50
# Returns come 1–14 days after the sale / Trả hàng sau 1–14 ngày
return_delay_min_ms = 86400000
return_delay_max_ms = 1209600000
restock_rate = 0.70
# Keyed-state TTL of pending returns, must outlast the max delay / TTL phiếu trả đang chờ, dài hơn trễ tối đa
state_days = 16
# After downtime, regenerate at most the last 6 hours / Sau khi dừng, chỉ sinh bù tối đa 6 giờ gần nhất
max_catchup_ms = 21600000
master_refresh_ms = 3600000

[outbox]
# OutboxRelayJob: inventory."Outbox" → inventory-movements / logistics-events
poll_interval_ms = 1000
batch_size = 500
# Published rows kept 3 days (Kafka keeps 1) / Dòng đã phát giữ 3 ngày (Kafka giữ 1)
retention_ms = 259200000
purge_interval_ms = 3600000
# PG errors in a row before the job fails and restarts / Số lỗi PG liên tiếp trước khi job lỗi và khởi động lại
max_consecutive_failures = 60

[supply_chain_realtime]
# SupplyChainRealtimeJob → report.realtime_inventory_position / report.realtime_shipment_status
batch_size = 500
batch_interval_ms = 2000
# Keyed state of a trip outlives the 30-day CH TTL / State của chuyến sống lâu hơn TTL 30 ngày của CH
shipment_state_days = 35
