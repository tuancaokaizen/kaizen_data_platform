[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-deploy"
version = "0.1.0"
description = "Deploy Superset dashboards from YAML (ClickHouse + MinIO GitOps)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "boto3>=1.34",
]

[project.scripts]
superset-deploy = "superset_deploy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
