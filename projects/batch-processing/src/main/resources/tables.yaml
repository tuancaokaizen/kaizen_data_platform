# Source tables ingested from Postgres information_system into stg (bronze) and fnd (silver).
# Bảng nguồn ingest từ Postgres information_system vào stg (bronze) và fnd (silver).
#
# Fields / Trường:
#   table           snake_case name of stg.<table> and fnd.<table>
#   group           ingest group: master | sales | payment | inventory | supply | hr
#   source          Postgres <schema>.<Table> (schema datagen is rejected)
#   load            full (read the whole table each run) | incremental (read by modified_column window)
#   key             merge key of fnd.<table>
#   modified_column newer value wins in the fnd MERGE; required for incremental
#   partition       none | months(<column>) | days(<column>) | identity(<column>), applied to fnd
#   columns         explicit columns and types (string, int, long, boolean, date, timestamp, decimal(p,s));
#                   a new column in Postgres never reaches the lakehouse until it is listed here
#
# Not ingested / Không ingest:
#   rules and parameters: ReplenishmentPolicy, SupplierProduct, CarrierRate, Lane, DeliverySchedule, DistanceMatrix
#   derivable: InventoryBalance (from stock_movement), OrderPayment and ReturnPayment (Payment.OrderId / ReturnId)
#   technical: Outbox, PostingCutover; every datagen table
#   personal data: Customer FullName/Phone/Address, Employee Phone/Address
#   simulation parameters: Supplier FillRate/LeadTimeStdDays, Carrier BaseOnTimeRate, Geography CoordMethod/CoordSource

# ── master ────────────────────────────────────────────────────────────────
- table: geography
  group: master
  source: public.Geography
  load: full
  key: [Id]
  modified_column: ModifiedDate
  columns:
    Id: string
    Name: string
    AdminCode: string
    WardType: string
    ProvinceCode: string
    LegacyProvince: string
    SubRegion: string
    Population: int
    Latitude: decimal(9,6)
    Longitude: decimal(9,6)
    AreaKm2: decimal(10,2)
    IsRoadAccessible: boolean
    CreatedDate: timestamp
    ModifiedDate: timestamp

