# Settings of the PROD environment (k3s cluster), selected by args(0) = PROD.
# Cấu hình môi trường PROD (cluster k3s), được chọn bởi args(0) = PROD.
#
# No password or key here: they come from the environment of the pod (Secret orchestrator/kaizen-batch-secrets).
# Không có mật khẩu hay khoá ở đây: chúng lấy từ biến môi trường của pod (Secret orchestrator/kaizen-batch-secrets).
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   MinIO
#   KAIZEN_POSTGRES_PASSWORD                   Postgres information_system
#   KAIZEN_CLICKHOUSE_PASSWORD                 ClickHouse

SPARK_SESSION_PROD {
  "spark.sql.session.timeZone" = "UTC"
  "spark.serializer" = "org.apache.spark.serializer.KryoSerializer"
  "spark.sql.shuffle.partitions" = "4"
  "spark.sql.extensions" = "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
  "spark.sql.catalog.nessie" = "org.apache.iceberg.spark.SparkCatalog"
  "spark.sql.catalog.nessie.catalog-impl" = "org.apache.iceberg.nessie.NessieCatalog"
  "spark.sql.catalog.nessie.uri" = "http://nessie-catalog-svc.compute.svc.cluster.local:19120/api/v1"
  "spark.sql.catalog.nessie.ref" = "main"
  "spark.sql.catalog.nessie.warehouse" = "s3a://iceberg-data"
  "spark.sql.catalog.nessie.io-impl" = "org.apache.iceberg.hadoop.HadoopFileIO"
  "spark.sql.catalog.nessie.gc-enabled" = "true"
  "spark.hadoop.fs.s3a.endpoint" = "http://minio.storage.svc.cluster.local:9000"
  "spark.hadoop.fs.s3a.path.style.access" = "true"
  "spark.hadoop.fs.s3a.connection.ssl.enabled" = "false"
  "spark.hadoop.fs.s3a.impl" = "org.apache.hadoop.fs.s3a.S3AFileSystem"
}

POSTGRES_PROD {
  host = "my-postgres-postgresql.databases.svc.cluster.local"
  port = 5432
  database = "information_system"
  user = "postgres"
  password_variable = "KAIZEN_POSTGRES_PASSWORD"
}

CLICKHOUSE_PROD {
  host = "clickhouse-service.databases.svc.cluster.local"
  port = 8123
  database = "report"
  user = "default"
  password_variable = "KAIZEN_CLICKHOUSE_PASSWORD"
}
