# Settings of the LOCAL environment (tests and runs on a laptop), selected by args(0) = LOCAL.
# The catalog is still named nessie so jobs read the same table names, but it is a Hadoop catalog in a local folder.
# Cấu hình môi trường LOCAL (test và chạy trên máy cá nhân), được chọn bởi args(0) = LOCAL.
# Catalog vẫn tên nessie để job đọc cùng tên bảng, nhưng là Hadoop catalog trong thư mục local.

SPARK_SESSION_LOCAL {
  "spark.master" = "local[2]"
  "spark.ui.enabled" = "false"
  "spark.sql.session.timeZone" = "UTC"
  "spark.sql.shuffle.partitions" = "2"
  "spark.sql.extensions" = "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
  "spark.sql.catalog.nessie" = "org.apache.iceberg.spark.SparkCatalog"
  "spark.sql.catalog.nessie.type" = "hadoop"
  "spark.sql.catalog.nessie.warehouse" = "file:///tmp/kaizen-lakehouse"
}

POSTGRES_LOCAL {
  host = "localhost"
  port = 5432
  database = "information_system"
  user = "postgres"
  password_variable = "KAIZEN_POSTGRES_PASSWORD"
}

CLICKHOUSE_LOCAL {
  host = "localhost"
  port = 8123
  database = "report"
  user = "admin"
  password_variable = "KAIZEN_CLICKHOUSE_PASSWORD"
}
