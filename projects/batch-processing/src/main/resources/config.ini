[postgres]
host = my-postgres-postgresql.databases.svc.cluster.local
port = 5432
database = information_system
username = postgres
password = datateam123
schema = public
# PostgreSQL VACUUM maintenance / Bảo trì VACUUM Postgres (PostgresVacuumJob)
vacuum_tables = order."Order",order."OrderItem",order."Return",order."ReturnItem",payment."Payment",payment."Transaction",payment."OrderPayment",payment."ReturnPayment"
vacuum_dry_run = false

[elasticsearch]
hosts = http://elasticsearch.logging.svc.cluster.local:9200

[clickhouse]
host = clickhouse-service.databases.svc.cluster.local
port = 8123
database = default
username = admin
password = kaizen123

[kafka]
bootstrap_servers = kaizen-kafka.streaming.svc.cluster.local:9092
group_id = kaizen-stream-group
auto_offset_reset = earliest
# Kafka retention maintenance / Dọn message Kafka (KafkaRetentionJob)
retention_days = 2
retention_ms = 172800000
retention_bytes_per_partition = 268435456
topic_partitions = 3
topics = order-bundles,payment-bundles
strategy = delete_records
dry_run = false
check_consumer_lag = true

[minio]
endpoint = http://minio.storage.svc.cluster.local:9000
access_key = admin
secret_key = kaizen123
bucket_name = iceberg-data

[spark]
master = local[*]
app_name = KaizenSparkBatchJob
executor_memory = 2g
driver_memory = 1g
