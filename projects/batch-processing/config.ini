[postgres]
host = localhost
port = 5432
database = kaizen_db
username = postgres
password = datateam123
schema = public
# PostgreSQL VACUUM maintenance / Bảo trì VACUUM Postgres (PostgresVacuumJob)
vacuum_tables = order."Order",order."OrderItem",order."Return",order."ReturnItem",payment."Payment",payment."Transaction",payment."OrderPayment",payment."ReturnPayment"
vacuum_dry_run = false

[elasticsearch]
hosts = http://localhost:9200

[clickhouse]
host = localhost
port = 8123
database = default
username = admin
password = kaizen123

[kafka]
bootstrap_servers = kaizen-kafka.default.svc.cluster.local:9092
group_id = kaizen-stream-group
auto_offset_reset = earliest
# Kafka retention maintenance / Dọn message Kafka (KafkaRetentionJob)
retention_days = 2
topics = order-bundles,payment-bundles
strategy = delete_records
dry_run = false
check_consumer_lag = true

[minio]
endpoint = http://localhost:31900
access_key = admin
secret_key = kaizen123
bucket_name = data-platform

[spark]
master = local[*]
app_name = KaizenSparkBatchJob
executor_memory = 2g
driver_memory = 1g

[flink]
parallelism = 2
checkpoint_interval_ms = 10000

[nlp]
model_name = vinai/phobert-base
batch_size = 16
