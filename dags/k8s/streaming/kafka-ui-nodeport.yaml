# NodePort for Helm kafka-ui (selector must match app.kubernetes.io/* labels, not app=kafka-ui).
# NodePort cho Helm kafka-ui (selector phải khớp label app.kubernetes.io/*, không dùng app=kafka-ui).
#
# Apply / Áp dụng:
#   kubectl apply -f dags/k8s/streaming/kafka-ui-nodeport.yaml
#
# UI: http://<node-ip>:31086
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-nodeport-service
  namespace: streaming
  labels:
    app.kubernetes.io/name: kafka-ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: kafka-ui
    app.kubernetes.io/name: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31086
      protocol: TCP
